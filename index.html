<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống theo dõi, xử lý yêu cầu hỗ trợ doanh nghiệp - Hải quan cửa khẩu quốc tế Móng Cái</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Hệ thống theo dõi, xử lý yêu cầu hỗ trợ doanh nghiệp - Hải quan cửa khẩu quốc tế Móng Cái">
  <meta name="robots" content="noindex, nofollow">

  <!-- Logo Hải quan -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Màn hình loading hiện trong lúc iframe đang tải */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo Hải quan: nhịp đập nhẹ + bóng đổ xanh tạo cảm giác glow */
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      filter: drop-shadow(0 6px 18px rgba(9, 105, 218, 0.28));
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.07); }
    }

    .loading-text {
      margin-top: 26px;
      color: #57606a;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    /* 3 dấu chấm hiện tuần tự kiểu typing */
    .dot {
      display: inline-block;
      opacity: 0;
      animation: dot-fade 1.4s infinite;
    }
    .dot:nth-child(1) { animation-delay: 0s;   }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot-fade {
      0%, 70%, 100% { opacity: 0; }
      30%, 60%      { opacity: 1; }
    }

    /* Iframe full-screen */
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loading">
    <img class="logo" src="favicon.ico" alt="Logo Hải quan">
    <div class="loading-text">
      Đang tải hệ thống<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxfuJkM-wfjC9Di2k5wFV2wYGqYxV5EJ3YGm0GW_2x2lSMSibeRCy2lU_jzSEME0boh/exec"
    allow="clipboard-write; clipboard-read; fullscreen"
    allowfullscreen
    onload="document.getElementById('loading').classList.add('hidden')">
  </iframe>

  <script>
    // Phòng trường hợp iframe load lâu, tự ẩn loading sau 8 giây
    setTimeout(function() {
      document.getElementById('loading').classList.add('hidden');
    }, 8000);
  </script>

</body>
</html>
