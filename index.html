<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống xử lý yêu cầu hỗ trợ - Hải quan CKQT Móng Cái</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Hệ thống tiếp nhận và xử lý yêu cầu hỗ trợ doanh nghiệp - Hải quan cửa khẩu quốc tế Móng Cái">
  <meta name="robots" content="noindex, nofollow">

  <!-- Logo Hải quan -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Màn hình loading hiện trong lúc iframe đang tải */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #d0d7de;
      border-top-color: #0969da;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 18px;
      color: #57606a;
      font-size: 14px;
    }

    /* Iframe full-screen */
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải...</div>
  </div>

  <iframe
    id="app"
    src="https://script.google.com/macros/s/AKfycbxfuJkM-wfjC9Di2k5wFV2wYGqYxV5EJ3YGm0GW_2x2lSMSibeRCy2lU_jzSEME0boh/exec"
    allow="clipboard-write; clipboard-read; fullscreen"
    allowfullscreen
    onload="document.getElementById('loading').classList.add('hidden')">
  </iframe>

  <script>
    // Phòng trường hợp iframe load lâu, tự ẩn loading sau 8 giây
    setTimeout(function() {
      document.getElementById('loading').classList.add('hidden');
    }, 8000);
  </script>

</body>
</html>
